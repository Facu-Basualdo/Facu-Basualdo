<svg xmlns="http://www.w3.org/2000/svg" width="106" height="44" viewBox="0 0 106 44" role="img" aria-label="Email"><title>Email</title><style>@font-face{font-family:'GM';src:url(data:font/woff2;base64,) format('woff2')}
.sube{animation:sube .55s cubic-bezier(.22,1,.36,1) backwards}
