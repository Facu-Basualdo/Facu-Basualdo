<svg xmlns="http://www.w3.org/2000/svg" width="207" height="36" viewBox="0 0 207 36" role="img" aria-label="facundo@basualdo.dev"><title>facundo@basualdo.dev</title><style>@font-face{font-family:'GeistB';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
