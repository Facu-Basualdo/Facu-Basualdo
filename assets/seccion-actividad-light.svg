<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="04 — Actividad"><title>04 — Actividad</title><style>@font-face{font-family:'GM';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GP';src:url(data:font/woff2;base64,) format('woff2')}
.sube{animation:sube .55s cubic-bezier(.22,1,.36,1) backwards}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aparece{animation:aparece .7s cubic-bezier(.22,1,.36,1) backwards}
@keyframes aparece{from{opacity:0}}
.linea{animation:linea 1.1s cubic-bezier(.22,1,.36,1) backwards;transform-box:fill-box;transform-origin:left}
@keyframes linea{from{transform:scaleX(0)}}
.baja{animation:baja 2.4s cubic-bezier(.22,1,.36,1) backwards;transform-box:fill-box;transform-origin:top}
@keyframes baja{from{transform:scaleY(0)}}
.cursor{animation:cursor 1.1s steps(1,end) infinite}
@keyframes cursor{50%{opacity:0}}
.ping{animation:ping 1s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{75%,100%{transform:scale(2.6);opacity:0}}
.titila{opacity:0;animation:titila 5s ease-in-out infinite}
@keyframes titila{0%,100%{opacity:0}50%{opacity:.85}}
.forma{opacity:0;animation:forma 8s steps(1,end) infinite}
@keyframes forma{0%{opacity:1}6%,100%{opacity:0}}
.base{animation:base 8s steps(1,end) infinite}
@keyframes base{0%{opacity:0}6%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.titila,.forma{opacity:0}}
</style><defs></defs><g transform="translate(0 48)"><text x="0.0" y="20.0" font-family="'GM',ui-monospace,monospace" font-size="12" fill="#0a0a0a" >04</text><rect x="30.4" y="15.5" width="714.4" height="1.0" fill="#e5e5e5" class="linea"/><text x="840.0" y="20.0" font-family="'GM',ui-monospace,monospace" font-size="12" fill="#6b6b6b" text-anchor="end" >/ actividad</text><g class="sube" style="animation-delay:0.10s"><text x="0.0" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >A</text></g><g class="sube" style="animation-delay:0.14s"><text x="36.5" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >c</text></g><g class="sube" style="animation-delay:0.18s"><text x="68.4" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >t</text></g><g class="sube" style="animation-delay:0.22s"><text x="91.2" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >i</text></g><g class="sube" style="animation-delay:0.26s"><text x="114.0" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >v</text></g><g class="sube" style="animation-delay:0.30s"><text x="143.6" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >i</text></g><g class="sube" style="animation-delay:0.34s"><text x="166.4" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >d</text></g><g class="sube" style="animation-delay:0.38s"><text x="200.6" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >a</text></g><g class="sube" style="animation-delay:0.42s"><text x="234.8" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#0a0a0a" >d</text></g><g class="sube" style="animation-delay:.3s"><text x="0.0" y="146.0" font-family="'GM',ui-monospace,monospace" font-size="14" fill="#6b6b6b" >Mis contribuciones del último año.</text></g></g></svg>