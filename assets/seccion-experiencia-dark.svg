" y="104.0" font-family="'GP',ui-monospace,monospace" font-size="60" fill="#ededed" >a</text></g><g class="sube" style="animation-delay:.3s"><text x="0.0" y="146.0" font-family="'GM',ui-monospace,monospace" font-size="14" fill="#8a8a8a" >Dónde trabajé, qué construí y con quién.</text></g></g></svg>