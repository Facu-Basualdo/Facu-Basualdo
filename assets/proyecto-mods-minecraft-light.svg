.cursor{animation:cursor 1.1s steps(1,end) infinite}
@keyframes cursor{50%{opacity:0}}
.ping{animation:ping 1s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
