<svg xmlns="http://www.w3.org/2000/svg" width="412" height="431" viewBox="0 0 412 431" role="img" aria-label="Brillo — Control de brillo para Windows, en la Microsoft Store"><title>Brillo — Control de brillo para Windows, en la Microsoft Store</title><style>@font-face{font-family:'GM';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GP';src:url(data:font/woff2;base64,) format('woff2')}
.sube{animation:sube .55s cubic-bezier(.22,1,.36,1) backwards}
