<svg xmlns="http://www.w3.org/2000/svg" width="412" height="248" viewBox="0 0 412 248" role="img" aria-label="Brillo: control de brillo para Windows, en la Microsoft Store"><title>Brillo: control de brillo para Windows, en la Microsoft Store</title><style>text{white-space:pre}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes parpadeo{50%{opacity:0}}
