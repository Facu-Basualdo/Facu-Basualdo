<svg xmlns="http://www.w3.org/2000/svg" width="840" height="304" viewBox="0 0 840 304" role="img" aria-label="Hola, soy Facu. Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta."><title>Hola, soy Facu. Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta.</title><style>@font-face{font-family:'GeistB';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GMono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes parpadeo{50%{opacity:0}}
@keyframes titila{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes traza{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.entra{animation:entra .35s ease-out backwards}
.cursor{animation:parpadeo 1s steps(1,end) infinite}
.titila{animation:titila 3s ease-in-out infinite}
.gira{animation:gira 24s linear infinite;transform-box:fill-box;transform-origin:center}
.traza{stroke-dasharray:1;animation:traza 1.2s ease-out backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes saluda{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(10deg)}50%{transform:rotate(-4deg)}}.saluda{animation:saluda 2.4s ease-in-out .6s 3;transform-box:fill-box;transform-origin:70% 80%}</style><defs><linearGradient id="franja" x1="0" y1="0" x2="1" y2="0"><stop offset="0.000" stop-color="#7aa7ff"/><stop offset="0.333" stop-color="#e955ee"/><stop offset="0.667" stop-color="#4aa8ff"/><stop offset="1.000" stop-color="#9fbf7a"/></linearGradient><clipPath id="panel"><rect width="840" height="304" rx="12"/></clipPath></defs><rect x=".5" y=".5" width="839" height="303" rx="12" fill="#0d1117" stroke="#30363d"/><rect class="traza" width="840" height="4" fill="url(#franja)" clip-path="url(#panel)"/><g class="entra" style="animation-delay:.05s"><text x="40.0" y="64.0" font-family="&#x27;GeistB&#x27;" font-size="28" fill="#e6edf3" >Hola, soy Facu</text><text x="245.6" y="64.0" font-family="&#x27;Segoe UI Emoji&#x27;,&#x27;Apple Color Emoji&#x27;,&#x27;Noto Color Emoji&#x27;,sans-serif" font-size="26" fill="#e6edf3" class="saluda">👋</text></g><g class="entra" style="animation-delay:.15s"><g transform="translate(40.0 77.0) scale(0.583)" fill="none" stroke="#7d8590" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0"/></g><text x="60.0" y="88.0" font-family="&#x27;GMono&#x27;" font-size="12.5" fill="#7d8590" >Resistencia, Chaco · desarrollador full-stack</text></g><g class="entra" style="animation-delay:.25s"><text x="40.0" y="124.0" font-family="&#x27;Geist&#x27;" font-size="15" fill="#e6edf3" fill-opacity=".9">Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps</text><text x="40.0" y="148.0" font-family="&#x27;Geist&#x27;" font-size="15" fill="#e6edf3" fill-opacity=".9">en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta.</text></g><rect x="40" y="160" width="760" height="1" fill="#30363d"/><g class="entra" style="animation-delay:0.40s"><rect x="40" y="186" width="28" height="28" rx="8" fill="#3fb950" fill-opacity=".15"/><g transform="translate(46.0 192.0) scale(0.667)" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10h3v-3l-3.5 -3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1 -3 3l-6 -6a6 6 0 0 1 -8 -8l3.5 3.5"/></g><text x="82.0" y="205.0" font-size="14.5"><tspan font-family="Geist" fill="#e6edf3">Ahora mismo: </tspan><tspan font-family="GeistB" fill="#7aa7ff">miFACU</tspan><tspan font-family="Geist" fill="#e6edf3"> como cofundador y </tspan><tspan font-family="GeistB" fill="#e955ee">Juegachos</tspan><tspan font-family="Geist" fill="#e6edf3"> como maintainer.</tspan></text></g><g class="entra" style="animation-delay:0.52s"><rect x="40" y="224" width="28" height="28" rx="8" fill="#e955ee" fill-opacity=".15"/><g transform="translate(46.0 230.0) scale(0.667)" fill="none" stroke="#e955ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h3.5a5 5 0 0 1 0 10h-5.5l-4.015 4.227a2.3 2.3 0 0 1 -3.923 -2.035l1.634 -8.173a5 5 0 0 1 4.904 -4.019h3.4"/><path d="M14 15l4.07 4.284a2.3 2.3 0 0 0 3.925 -2.023l-1.6 -8.232"/><path d="M8 9v2"/><path d="M7 10h2"/><path d="M14 10h2"/></g><text x="82.0" y="243.0" font-size="14.5"><tspan font-family="Geist" fill="#e6edf3">Juegachos es open source: si tenés una idea de juego, </tspan><tspan font-family="GeistB" fill="#4493f8">mandá un PR</tspan><tspan font-family="Geist" fill="#e6edf3">.</tspan></text></g><g class="entra" style="animation-delay:0.64s"><rect x="40" y="262" width="28" height="28" rx="8" fill="#d29922" fill-opacity=".15"/><g transform="translate(46.0 268.0) scale(0.667)" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8"/><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8"/><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5"/><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0"/><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5"/><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10"/></g><text x="82.0" y="281.0" font-size="14.5"><tspan font-family="Geist" fill="#e6edf3">Me interesan la IA aplicada, el tiempo real y los gráficos en el navegador.</tspan></text></g></svg>