<svg xmlns="http://www.w3.org/2000/svg" width="840" height="298" viewBox="0 0 840 298" role="img" aria-label="Hola, soy Facu. Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta."><title>Hola, soy Facu. Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta.</title><style>@font-face{font-family:'GeistB';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GMono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes parpadeo{50%{opacity:0}}
@keyframes titila{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes traza{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.entra{animation:entra .35s ease-out backwards}
.cursor{animation:parpadeo 1s steps(1,end) infinite}
.titila{animation:titila 3s ease-in-out infinite}
.gira{animation:gira 24s linear infinite;transform-box:fill-box;transform-origin:center}
.traza{stroke-dasharray:1;animation:traza 1.2s ease-out backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="panel"><rect width="840" height="298" rx="10"/></clipPath><radialGradient id="azul" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#7aa7ff" stop-opacity=".2"/><stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/></radialGradient><radialGradient id="rosa" cx=".05" cy="1.1" r=".6"><stop offset="0" stop-color="#e955ee" stop-opacity=".12"/><stop offset="1" stop-color="#e955ee" stop-opacity="0"/></radialGradient><pattern id="puntos" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="1.2" height="1.2" fill="#fff" fill-opacity=".09"/></pattern><radialGradient id="desvanece" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="esquina"><rect width="840" height="298" fill="url(#desvanece)"/></mask></defs><g clip-path="url(#panel)"><rect width="840" height="298" fill="#0a0a0a"/><rect width="840" height="298" fill="url(#azul)"/><rect width="840" height="298" fill="url(#rosa)"/><rect width="840" height="298" fill="url(#puntos)" mask="url(#esquina)"/></g><rect x=".5" y=".5" width="839" height="297" rx="10" fill="none" stroke="#2a2a30"/><g class="entra" style="animation-delay:.05s"><text x="44.0" y="70.0" font-family="&#x27;GeistB&#x27;" font-size="32" fill="#fafafa" >Hola, soy Facu</text></g><g class="entra" style="animation-delay:.15s"><g transform="translate(44.0 84.0) scale(0.583)" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0"/></g><text x="64.0" y="95.0" font-family="&#x27;GMono&#x27;" font-size="12.5" fill="#71717a" >Resistencia, Chaco · desarrollador full-stack</text></g><g class="entra" style="animation-delay:.25s"><text x="44.0" y="130.0" font-family="&#x27;Geist&#x27;" font-size="15" fill="#a1a1aa" >Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps</text><text x="44.0" y="154.0" font-family="&#x27;Geist&#x27;" font-size="15" fill="#a1a1aa" >en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta.</text></g><path d="M44 166H796" stroke="#2a2a30" stroke-dasharray="3 5"/><g class="entra" style="animation-delay:0.40s"><circle cx="49" cy="199" r="3" fill="#71717a"/><text x="64.0" y="204.0" font-size="14.5"><tspan font-family="Geist" fill="#d4d4d8">Ahora mismo: </tspan><tspan font-family="GeistB" fill="#7aa7ff">miFACU</tspan><tspan font-family="Geist" fill="#d4d4d8"> como cofundador y </tspan><tspan font-family="GeistB" fill="#e955ee">Juegachos</tspan><tspan font-family="Geist" fill="#d4d4d8"> como maintainer.</tspan></text></g><g class="entra" style="animation-delay:0.52s"><circle cx="49" cy="233" r="3" fill="#71717a"/><text x="64.0" y="238.0" font-size="14.5"><tspan font-family="Geist" fill="#d4d4d8">Juegachos es open source: si tenés una idea de juego, </tspan><tspan font-family="GeistB" fill="#fafafa">mandá un PR</tspan><tspan font-family="Geist" fill="#d4d4d8">.</tspan></text></g><g class="entra" style="animation-delay:0.64s"><circle cx="49" cy="267" r="3" fill="#71717a"/><text x="64.0" y="272.0" font-size="14.5"><tspan font-family="Geist" fill="#d4d4d8">Disponible para trabajo </tspan><tspan font-family="GeistB" fill="#fafafa">remoto o presencial</tspan><tspan font-family="Geist" fill="#d4d4d8"> · UTC-3.</tspan></text></g></svg>