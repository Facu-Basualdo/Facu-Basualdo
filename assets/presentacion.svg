<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-label="Hola, soy Facu. Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta."><title>Hola, soy Facu. Estudio Ingeniería en Sistemas en la UTN FRRe y me gusta construir cosas que la gente use de verdad: apps en las tiendas, juegos que se juegan con amigos y herramientas que resuelven una molestia concreta.</title><style>@font-face{font-family:'GeistB';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GMono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes parpadeo{50%{opacity:0}}
@keyframes titila{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes traza{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.entra{animation:entra .35s ease-out backwards}
.cursor{animation:parpadeo 1s steps(1,end) infinite}
.titila{animation:titila 3s ease-in-out infinite}
.gira{animation:gira 24s linear infinite;transform-box:fill-box;transform-origin:center}
.traza{stroke-dasharray:1;animation:traza 1.2s ease-out backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
